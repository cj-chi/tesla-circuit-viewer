<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesla EE Architecture — Circuit Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- Header -->
  <header id="header">
    <div class="header-left">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <div>
          <div class="logo-title">Tesla EE Architecture</div>
          <div class="logo-sub">Circuit Diagram Explorer</div>
        </div>
      </div>
    </div>
    <div class="header-center">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋接頭、訊號、系統名稱..." autocomplete="off">
        <div id="searchDropdown" class="search-dropdown"></div>
      </div>
    </div>
    <div class="header-right">
      <div class="stats">
        <div class="stat"><span id="statPdfs">0</span><small>圖紙</small></div>
        <div class="stat"><span id="statLinks">0</span><small>連線</small></div>
        <div class="stat"><span id="statConns">0</span><small>接頭</small></div>
      </div>
      <button class="btn-refresh" onclick="runParser()" title="重新解析 PDF">🔄 重新解析</button>
    </div>
  </header>

  <!-- Main Content -->
  <div id="main">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-tabs">
        <button class="tab active" data-tab="diagrams">📄 圖紙</button>
        <button class="tab" data-tab="connectors">🔌 接頭</button>
        <button class="tab" data-tab="signals">📡 訊號</button>
      </div>

      <div id="tab-diagrams" class="tab-content active">
        <div class="section-label">按系統分類</div>
        <div id="diagramList"></div>
      </div>

      <div id="tab-connectors" class="tab-content">
        <div class="section-label">接頭索引</div>
        <div id="connectorList"></div>
      </div>

      <div id="tab-signals" class="tab-content">
        <div class="section-label">訊號索引</div>
        <div id="signalList"></div>
      </div>
    </aside>

    <!-- Graph Area -->
    <div id="content">
      <!-- View Toggle -->
      <div id="viewToggle">
        <button class="view-btn active" id="btnGraph" onclick="switchView('graph')">🕸 系統連線</button>
        <button class="view-btn" id="btnExplorer" onclick="switchView('explorer')" style="display:none">🔀 實體拓樸</button>
        <button class="view-btn" id="btnGrid" onclick="switchView('grid')">📋 圖紙列表</button>
        <button class="view-btn" id="btnPdf" onclick="switchView('pdf')" style="display:none">📄 PDF 檢視</button>
        <div class="view-controls">
          <label><input type="checkbox" id="showConnectors" checked onchange="filterGraph()"> 接頭連線</label>
          <label><input type="checkbox" id="showSignals" checked onchange="filterGraph()"> 訊號連線</label>
          <input type="range" id="linkStrength" min="1" max="10" value="5" oninput="updateForce()">
          <span>連線強度</span>
        </div>
      </div>

      <!-- Graph View -->
      <div id="graphView">
        <svg id="graphSvg"></svg>
        <div id="tooltip"></div>
        <div id="graphLegend">
          <div><span class="leg-dot connector"></span> 共用接頭</div>
          <div><span class="leg-dot signal"></span> 共用訊號</div>
        </div>
      </div>

      <!-- Grid View -->
      <div id="gridView" style="display:none">
        <div id="gridContent"></div>
      </div>

      <!-- Entity Explorer View -->
      <div id="explorerView" style="display:none">
        <div id="explorerHeader">
          <div id="breadcrumb"></div>
          <button id="btnCenterExplorer" class="btn-refresh" title="置中畫面">🎯 置中</button>
        </div>
        <div id="explorerMain">
          <svg id="explorerSvg"></svg>
          <div id="explorerInfoCard" style="display:none">
            <h3 id="exCardTitle">--</h3>
            <div id="exCardMeta"></div>
            <!-- Signal Filters -->
            <div id="exCardFilters" style="display:none">
              <div class="filter-header">
                <span>連線過濾器</span>
                <div>
                  <button onclick="toggleAllFilters(true)">全選</button>
                  <button onclick="toggleAllFilters(false)">全不選</button>
                </div>
              </div>
              <div id="filterList"></div>
            </div>
            <!-- Main Content -->
            <div id="exCardContent"></div>
            <div id="exCardActions"></div>
          </div>
        </div>
      </div>

      <!-- PDF Viewer -->
      <div id="pdfView" style="display:none">
        <div id="pdfHeader">
          <button onclick="closePdf()">← 返回</button>
          <span id="pdfTitle"></span>
          <div id="pdfNav">
            <button onclick="prevPage()">◀</button>
            <span id="pageInfo"></span>
            <button onclick="nextPage()">▶</button>
          </div>
          <a id="pdfOpen" href="#" target="_blank">在新分頁開啟 ↗</a>
        </div>
        <div id="pdfConnInfo"></div>
        <iframe id="pdfFrame" src=""></iframe>
      </div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loading">
    <div class="spinner"></div>
    <div id="loadingText">載入電路資料中...</div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
